<!-- ============================================================
  Hair & Beauty Website Popup
  ------------------------------------------------------------
  How to use:
  1. Paste this entire block just before the closing </body> tag
     of your website.
  2. Edit the text inside the HTML section (headline, offer,
     button) to match your salon/brand.
  3. The popup auto-opens after 4 seconds and only shows once
     per visitor per day (using localStorage). Adjust timing
     and frequency in the JS section below.
============================================================= -->

<style>
  #bp-overlay {
    position: fixed;
    inset: 0;
    background: rgba(30, 20, 20, 0.55);
    backdrop-filter: blur(3px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    opacity: 0;
    transition: opacity 0.35s ease;
    padding: 20px;
  }
  #bp-overlay.bp-show {
    display: flex;
    opacity: 1;
  }

  #bp-card {
    position: relative;
    width: 100%;
    max-width: 420px;
    background: #fdf6f2;
    border-radius: 18px;
    padding: 40px 34px 34px;
    text-align: center;
    font-family: 'Georgia', 'Times New Roman', serif;
    box-shadow: 0 30px 60px rgba(0,0,0,0.25);
    transform: translateY(20px) scale(0.96);
    transition: transform 0.35s ease;
  }
  #bp-overlay.bp-show #bp-card {
    transform: translateY(0) scale(1);
  }

  #bp-card::before {
    content: "";
    position: absolute;
    top: 10px; left: 10px; right: 10px; bottom: 10px;
    border: 1px solid #e3b8a8;
    border-radius: 12px;
    pointer-events: none;
  }

  #bp-close {
    position: absolute;
    top: 12px;
    right: 14px;
    background: none;
    border: none;
    font-size: 22px;
    line-height: 1;
    color: #a97b6b;
    cursor: pointer;
    font-family: Arial, sans-serif;
  }
  #bp-close:hover { color: #7a4f42; }

  #bp-eyebrow {
    letter-spacing: 3px;
    text-transform: uppercase;
    font-size: 11px;
    color: #c08a6f;
    font-family: Arial, sans-serif;
    margin-bottom: 10px;
  }

  #bp-headline {
    font-size: 28px;
    color: #3d2b26;
    margin: 0 0 10px;
    font-weight: normal;
  }

  #bp-sub {
    font-size: 15px;
    color: #6f5a53;
    font-family: Arial, sans-serif;
    line-height: 1.5;
    margin: 0 0 24px;
  }

  #bp-form {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  #bp-email {
    padding: 13px 16px;
    border: 1px solid #e0c3b7;
    border-radius: 8px;
    font-size: 15px;
    font-family: Arial, sans-serif;
    outline: none;
    background: #fff;
    color: #3d2b26;
  }
  #bp-email:focus {
    border-color: #c08a6f;
  }

  #bp-submit {
    padding: 13px 16px;
    border: none;
    border-radius: 8px;
    background: #b5674f;
    color: #fff;
    font-size: 15px;
    font-family: Arial, sans-serif;
    letter-spacing: 0.5px;
    cursor: pointer;
    transition: background 0.2s ease;
  }
  #bp-submit:hover { background: #9c5540; }

  #bp-fine {
    font-size: 11px;
    color: #a5928c;
    font-family: Arial, sans-serif;
    margin-top: 16px;
  }

  #bp-success {
    display: none;
    font-family: Arial, sans-serif;
    color: #3d2b26;
    font-size: 15px;
    padding: 10px 0 0;
  }

  @media (max-width: 480px) {
    #bp-card { padding: 32px 22px 26px; }
    #bp-headline { font-size: 24px; }
  }
</style>

<div id="bp-overlay">
  <div id="bp-card" role="dialog" aria-modal="true" aria-labelledby="bp-headline">
    <button id="bp-close" aria-label="Close popup">&times;</button>

    <div id="bp-eyebrow">Studio Exclusive</div>
    <h2 id="bp-headline">Get 15% Off Your First Visit</h2>
    <p id="bp-sub">
      Join our list for early access to appointment slots,
      seasonal color trends, and members-only offers.
    </p>

    <form id="bp-form">
      <input
        id="bp-email"
        type="email"
        placeholder="Your email address"
        required
      />
      <button id="bp-submit" type="submit">Claim My 15% Off</button>
    </form>

    <div id="bp-success">
      🎉 You're on the list! Check your inbox for your discount code.
    </div>

    <div id="bp-fine">No spam. Unsubscribe anytime.</div>
  </div>
</div>

<script>
  (function () {
    var STORAGE_KEY = "bpPopupLastShown";
    var SHOW_AFTER_MS = 4000;       // delay before popup appears
    var HOURS_BEFORE_REPEAT = 24;   // don't re-show within this window

    var overlay = document.getElementById("bp-overlay");
    var closeBtn = document.getElementById("bp-close");
    var form = document.getElementById("bp-form");
    var successMsg = document.getElementById("bp-success");

    function shouldShow() {
      var last = localStorage.getItem(STORAGE_KEY);
      if (!last) return true;
      var hoursSince = (Date.now() - parseInt(last, 10)) / 36e5;
      return hoursSince >= HOURS_BEFORE_REPEAT;
    }

    function openPopup() {
      overlay.classList.add("bp-show");
      localStorage.setItem(STORAGE_KEY, Date.now().toString());
    }

    function closePopup() {
      overlay.classList.remove("bp-show");
    }

    if (shouldShow()) {
      setTimeout(openPopup, SHOW_AFTER_MS);
    }

    closeBtn.addEventListener("click", closePopup);
    overlay.addEventListener("click", function (e) {
      if (e.target === overlay) closePopup();
    });
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape") closePopup();
    });

    form.addEventListener("submit", function (e) {
      e.preventDefault();
      // ---- Replace this with your real signup logic ----
      // e.g. send to Mailchimp / Klaviyo / your backend via fetch()
      // ----------------------------------------------------
      form.style.display = "none";
      successMsg.style.display = "block";
      setTimeout(closePopup, 3000);
    });
  })();
</script>
